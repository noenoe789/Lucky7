DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monetag Reward System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: radial-gradient(ellipse at top right, #1e2a4a 0%, #0d1326 50%, #05070e 100%);
            overflow: hidden;
        }

        .moon {
            position: absolute;
            top: 8%;
            right: 10%;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fffdf0 0%, #fceea7 60%, #e6c86e 100%);
            box-shadow: 
                0 0 30px rgba(255, 250, 210, 0.8),
                0 0 70px rgba(255, 240, 180, 0.4),
                0 0 120px rgba(255, 230, 150, 0.2);
            z-index: 1;
            animation: moonGlow 4s infinite alternate ease-in-out;
        }

        .moon::before {
            content: '';
            position: absolute;
            top: 22px;
            left: 25px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(210, 185, 110, 0.25);
            box-shadow: 
                35px 15px 0 -4px rgba(210, 185, 110, 0.2),
                15px 45px 0 2px rgba(210, 185, 110, 0.22);
        }

        @keyframes moonGlow {
            0% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 250, 210, 0.7), 0 0 70px rgba(255, 240, 180, 0.3); }
            100% { transform: scale(1.03); box-shadow: 0 0 40px rgba(255, 250, 210, 0.9), 0 0 90px rgba(255, 240, 180, 0.5); }
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
            z-index: 1;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

            height: var(--size);

                0 0 8px var(--glow-color),
                0 0 18px var(--glow-color),
                0 0 28px var(--glow-color);
